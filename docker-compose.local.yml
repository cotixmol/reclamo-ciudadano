version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: ["python3", "app.py"]

  frontend:
    build:
      context: ./frontend-rc
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    volumes:
      - ./frontend-rc:/app
      - /app/node_modules
    ports:
      - "3000:3000"
