services:
  backend:
    image: registry.reputacion.digital/reclamo_ciudadano_back:${IMAGE_VERSION}
    volumes:
      - ./.env:/app/.env
    ports:
      - "8007:8000"
    # env_file:
    #   - ./backend/.env
    command: ["python3", "app.py"]
    networks:
      - traefik-public


  frontend:
    image: registry.reputacion.digital/reclamo_ciudadano_front:${IMAGE_VERSION}
    volumes:
      - .env:/app/.env
    ports:
      - "3007:3000"
    labels:
      # Enable Traefik for reclamo_ciudadano service
      - traefik.enable=true
      # Tell traefic wich port is the container using
      - traefik.http.services.reclamo_ciudadano.loadbalancer.server.port=3000
      # http for this container
      - traefik.http.routers.reclamo_ciudadano-http.entrypoints=http
      - traefik.http.routers.reclamo_ciudadano-http.rule=Host(`${SERVER_PREFIX:-}reclamo-ciudadano.reputacion.digital`)
      # Connect to network (must be already created whith: docker)
      - traefik.docker.network=traefik-public
      # Make Traefik use this domain in HTTPS
      - traefik.http.routers.reclamo_ciudadano-https.entrypoints=https
      - traefik.http.routers.reclamo_ciudadano-https.rule=Host(`${SERVER_PREFIX:-}reclamo-ciudadano.reputacion.digital`)
      - traefik.http.routers.reclamo_ciudadano-https.tls=true
      # Use the "le" (Let's Encrypt) resolver
      - traefik.http.routers.reclamo_ciudadano-https.tls.certresolver=le
      # Middleware to redirect HTTP to HTTPS
      - traefik.http.routers.reclamo_ciudadano-http.middlewares=https-redirect
#      - traefik.http.routers.manager-https.middlewares=admin-auth
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
