stages:
  - build-back
  - deploy-back
  - build-front
  - deploy-front
  - migrate

##########################
#     DEV PIPELINE
##########################

# Dev: Build Back
dev_build_back:
  stage: build-back
  image: docker:latest
  tags:
    - saas
  services:
    - docker:dind
  # Runs only on 'develop'
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  before_script:
    - unset DOCKER_HOST
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      source VERSION
      tag="$CI_COMMIT_REF_SLUG$VERSION"
      echo "DEV BACKEND BUILD -- tag='$tag' branch='$CI_COMMIT_BRANCH'"
    - cd backend
    - docker build -f Dockerfile --pull -t "$CI_REGISTRY/reclamo_ciudadano_back:$tag" .
    - docker push "$CI_REGISTRY/reclamo_ciudadano_back:$tag"

# Dev: Build Front
dev_build_front:
  # Also in 'build-back' stage so it runs in parallel with dev_build_back
  stage: build-back
  image: docker:latest
  tags:
    - saas
  services:
    - docker:dind
  # Runs only on 'develop'
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      source VERSION
      tag="$CI_COMMIT_REF_SLUG$VERSION"
      echo "DEV FRONTEND BUILD -- tag='$tag' branch='$CI_COMMIT_BRANCH'"
    - cd frontend-rc
    - docker build -f Dockerfile --pull -t "$CI_REGISTRY/reclamo_ciudadano_front:$tag" .
    - docker push "$CI_REGISTRY/reclamo_ciudadano_front:$tag"

# Dev: Deploy
dev_deploy:
  # Put dev deploy in 'deploy-back' stage
  stage: deploy-back
  image: "ieferrari/ansible:11.0.0"
  tags:
    - saas
  # Wait for both dev_build_front & dev_build_back
  needs: [dev_build_front, dev_build_back]
  # Runs only on 'develop'
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - source VERSION
    - |
      tag="$CI_COMMIT_REF_SLUG$VERSION"
      echo "<<<< DEVELOPMENT DEPLOY >>>>"
      target_server="dev"
      folder_name="reclamo_ciudadano_dev"
      cat $ansible_credentials_yml_dev >> .infra/.ansible/cred.yml
      mv .infra/.env_dev .env
      mv docker-compose.yml docker-compose.yml.bak || true
      mv docker-compose.local.yml docker-compose.yml || true
    - chmod +x .infra/.ansible/inject_secrets.sh
    - .infra/.ansible/inject_secrets.sh
    - sed -i "s/IMAGE_VERSION=0*/IMAGE_VERSION=\"$tag\"/" .env
    - export ANSIBLE_CONFIG=$(pwd)/.infra/.ansible/ansible.cfg
    - ansible-playbook -i .infra/hosts .infra/.ansible/docker_remote_launch.yml \
        --extra-vars "server_name=$target_server folder_name=$folder_name"

# Dev: Migrate
dev_migrate:
  stage: migrate
  image: python:3.12-slim-bookworm
  tags:
    - saas
  needs: [dev_deploy]
  # Runs only on 'develop'
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      echo "Running dev migration..."
      mv .infra/.env_dev .env
    - chmod +x .infra/.ansible/inject_secrets.sh
    - .infra/.ansible/inject_secrets.sh
    - mv .env backend/.env && cd backend
    - pip install alembic sqlmodel python-dotenv psycopg2-binary pydantic geoalchemy2
    - alembic upgrade head

##########################
#    MAIN (PROD) PIPELINE
##########################

# 1) Build Back (Main)
main_build_back:
  stage: build-back
  image: docker:latest
  tags:
    - saas
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - unset DOCKER_HOST
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      source VERSION
      tag="$VERSION"
      echo "MAIN BACKEND BUILD -- tag='$tag'"
    - cd backend
    - docker build -f Dockerfile --pull -t "$CI_REGISTRY/reclamo_ciudadano_back:$tag" .
    - docker push "$CI_REGISTRY/reclamo_ciudadano_back:$tag"

# 2) Deploy Back (Main)
main_deploy_back:
  stage: deploy-back
  image: "ieferrari/ansible:11.0.0"
  tags:
    - saas
  needs: [main_build_back]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      source VERSION
      tag="$VERSION"
      echo "<<<< PRODUCTION BACKEND DEPLOY >>>>"
      target_server="prod"
      folder_name="reclamo_ciudadano"
      cat $ansible_credentials_yml >> .infra/.ansible/cred.yml
      mv docker-compose.prod.yml docker-compose.yml
      mv .infra/.env_prod .env
    - chmod +x .infra/.ansible/inject_secrets.sh
    - .infra/.ansible/inject_secrets.sh
    - sed -i "s/IMAGE_VERSION=0*/IMAGE_VERSION=\"$tag\"/" .env
    - export ANSIBLE_CONFIG=$(pwd)/.infra/.ansible/ansible.cfg
    - ansible-playbook -i .infra/hosts .infra/.ansible/docker_remote_launch.yml \
        --extra-vars "server_name=$target_server folder_name=$folder_name"

# 3) Build Front (Main)
main_build_front:
  stage: build-front
  image: docker:latest
  tags:
    - saas
  services:
    - docker:dind
  # Wait for the backend to deploy first
  needs: [main_deploy_back]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      source VERSION
      tag="$VERSION"
      echo "MAIN FRONTEND BUILD -- tag='$tag'"
    - cd frontend-rc
    - docker build \
        --build-arg NODE_ENV=production \
        -f Dockerfile \
        --pull \
        -t "$CI_REGISTRY/reclamo_ciudadano_front:$tag" .
    - docker push "$CI_REGISTRY/reclamo_ciudadano_front:$tag"

# 4) Deploy Front (Main)
main_deploy_front:
  stage: deploy-front
  image: "ieferrari/ansible:11.0.0"
  tags:
    - saas
  needs: [main_build_front]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      source VERSION
      tag="$VERSION"
      echo "<<<< PRODUCTION FRONTEND DEPLOY >>>>"
      target_server="prod"
      folder_name="reclamo_ciudadano"
      # Re-use .infra/.env_prod if needed
      mv .infra/.env_prod .env
      cat $ansible_credentials_yml >> .infra/.ansible/cred.yml
    - chmod +x .infra/.ansible/inject_secrets.sh
    - .infra/.ansible/inject_secrets.sh
    - sed -i "s/IMAGE_VERSION=0*/IMAGE_VERSION=\"$tag\"/" .env
    - export ANSIBLE_CONFIG=$(pwd)/.infra/.ansible/ansible.cfg
    - ansible-playbook -i .infra/hosts .infra/.ansible/docker_remote_launch.yml \
        --extra-vars "server_name=$target_server folder_name=$folder_name"

# 5) Migrate (Main)
main_migrate:
  stage: migrate
  image: python:3.12-slim-bookworm
  tags:
    - saas
  needs: [main_deploy_front]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      echo "Running production migration..."
      mv .infra/.env_prod .env
    - chmod +x .infra/.ansible/inject_secrets.sh
    - .infra/.ansible/inject_secrets.sh
    - mv .env backend/.env && cd backend
    - pip install alembic sqlmodel python-dotenv psycopg2-binary pydantic geoalchemy2
    - alembic upgrade head
